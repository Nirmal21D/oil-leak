version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegissea_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/app/models/weights:/app/backend/app/models/weights
    environment:
      - FASTAPI_ENV=production
      - API_PORT=8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegissea_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
